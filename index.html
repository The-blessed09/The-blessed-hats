<!DOCTYPE html>
<html>
<head>
  <title>The Blessed Hats</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: white;
      color: black;
      text-align: center;
    }

    /* 🔝 Título */
    .header {
      font-size: 42px;
      font-weight: bold;
      padding: 25px;
      color: black;
    }

    /* 🖼 Contenedor imagen MÁS GRANDE */
    .imagen {
      height: 800px; /* más espacio para imagen gigante */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 🧢 Imagen MUY GRANDE */
    .img-gorra {
      width: 100%;
      max-width: 1500px; /* 🔥 tamaño que pediste */
      height: auto;
    }

    /* 📦 Caja */
    .box {
      position: fixed;
      bottom: 200px;
      left: 50%;
      transform: translateX(-50%);
      border: 2px solid black;
      border-radius: 25px;
      padding: 45px;
      width: 92%;
      max-width: 500px;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .ok {
      color: black;
      font-size: 24px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .nombre {
      font-size: 22px;
      margin-bottom: 15px;
    }

    .scans {
      font-size: 20px;
      color: #333;
    }
  </style>
</head>

<body>

<!-- 🔝 Marca -->
<div class="header">The Blessed Hats</div>

<!-- 🧢 Imagen -->
<div class="imagen">
  <img src="gorra.png" alt="Gorra Devil Magic" class="img-gorra">
</div>

<!-- 📦 Caja -->
<div class="box">
  <div class="ok">✔ Autenticado por The Blessed Hats</div>
  <div class="nombre">Gorra: <span id="nombre"></span></div>
  <div class="scans">Escaneos: <span id="scans">0</span></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD9pRqLGAhEFIjueCK6PxWXFxWb_tnUBcg",
    authDomain: "autenticidad-8dad7.firebaseapp.com",
    projectId: "autenticidad-8dad7",
    storageBucket: "autenticidad-8dad7.firebasestorage.app",
    messagingSenderId: "613750291310",
    appId: "1:613750291310:web:d6eeacf20efd1e2ee05f7f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  async function cargar() {
    const ref = doc(db, "gorras", id);
    const snap = await getDoc(ref);

    if (snap.exists()) {
      const data = snap.data();

      await updateDoc(ref, {
        scans: increment(1)
      });

      document.getElementById("scans").innerText = (data.scans || 0) + 1;
      document.getElementById("nombre").innerText = data.nombre || "Devil Magic";

    } else {
      document.querySelector(".box").innerHTML = "<h2>ID no válido ❌</h2>";
    }
  }

  cargar();
</script>

</body>
</html>
