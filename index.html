<!DOCTYPE html>
<html>
<head>
  <title>The Blessed Hats</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    /* 🔝 Título arriba */
    .header {
      font-size: 28px;
      font-weight: bold;
      padding: 20px;
    }

    /* 🎨 Espacio para imagen */
    .imagen {
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: gray;
    }

    /* 📦 Caja abajo */
    .box {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      border: 2px solid gold;
      border-radius: 20px;
      padding: 20px;
      width: 80%;
      max-width: 350px;
      background: #111;
    }

    .ok {
      color: gold;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .nombre {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .scans {
      font-size: 16px;
      color: lightgray;
    }
  </style>
</head>

<body>

<!-- 🔝 Marca -->
<div class="header">The Blessed Hats</div>

<!-- 🎨 Espacio para diseño -->
<div class="imagen">
  (Aquí puedes poner imagen de la gorra después)
</div>

<!-- 📦 Caja de info -->
<div class="box">
  <div class="ok">✔ Autenticado por The Blessed Hats</div>
  <div class="nombre">Gorra: <span id="nombre"></span></div>
  <div class="scans">Escaneos: <span id="scans">0</span></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD9pRqLGAhEFIjueCK6PxWXFxWb_tnUBcg",
    authDomain: "autenticidad-8dad7.firebaseapp.com",
    projectId: "autenticidad-8dad7",
    storageBucket: "autenticidad-8dad7.firebasestorage.app",
    messagingSenderId: "613750291310",
    appId: "1:613750291310:web:d6eeacf20efd1e2ee05f7f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  async function cargar() {
    const ref = doc(db, "gorras", id);
    const snap = await getDoc(ref);

    if (snap.exists()) {
      const data = snap.data();

      // 🔥 Sumar escaneo
      await updateDoc(ref, {
        scans: increment(1)
      });

      document.getElementById("scans").innerText = (data.scans || 0) + 1;
      document.getElementById("nombre").innerText = data.nombre || "Devil Magic";

    } else {
      document.querySelector(".box").innerHTML = "<h2>ID no válido ❌</h2>";
    }
  }

  cargar();
</script>

</body>
</html>
