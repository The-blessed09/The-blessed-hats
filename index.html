<!DOCTYPE html>
<html>
<head>
  <title>The Blessed Hats</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin:0;
      font-family:Arial;
      color:black;
      text-align:center;
      min-height:100vh;
    }

    /* 🔥 Fondo Devil Magic (AHORA SÍ FUNCIONA) */
    body.devil-bg {
      background: url('https://the-blessed09.github.io/The-blessed-hats/fondo-devil.png') no-repeat center center fixed;
      background-size: cover;
    }

    .header { font-size:42px; font-weight:bold; padding:25px; }

    .imagen { height:800px; display:flex; align-items:center; justify-content:center; position:relative; }
    .img-gorra { width:100%; max-width:1500px; height:auto; z-index:1; }

    .imagen.devil {
      background: url('diablo.png') center center no-repeat;
      background-size:cover;
    }

    .titulo-gorra {
      font-family:'Cinzel Decorative', serif;
      font-size:40px;
      font-weight:bold;
      margin-top:20px;
      margin-bottom:25px;
    }

    .box {
      position:fixed;
      bottom:320px;
      left:50%;
      transform:translateX(-50%);
      border:2px solid black;
      border-radius:30px;
      padding:60px;
      width:95%;
      max-width:650px;
      background:white;
      box-shadow:0 12px 35px rgba(0,0,0,0.25);
    }

    .ok { font-size:28px; margin-bottom:20px; font-weight:bold; }
    .nombre { font-size:26px; margin-bottom:20px; }
    .scans { font-size:24px; color:#333; }

    .lluvia {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      pointer-events:none;
      overflow:hidden;
      z-index:999;
    }

    .flor, .ninja, .diamante, .billete, .carta {
      position:absolute;
      font-size:24px;
      animation:caer 3s linear forwards;
    }

    .flor { color:pink; }
    .ninja { color:#6e4b2c; }
    .diamante { color:#00BFFF; }
    .billete { color:green; }

    .carta {
      width:40px;
      height:60px;
      background:url('carta.png') no-repeat center center;
      background-size:contain;
      animation:caerCarta 4s linear forwards;
    }

    @keyframes caer {
      0% { transform:translateY(-100px); opacity:1; }
      100% { transform:translateY(100vh); opacity:0; }
    }

    @keyframes caerCarta {
      0% { top:-100px; transform:rotate(0deg); opacity:1; left: calc(10% + 80vw * var(--rand)); }
      100% { top:100vh; transform:rotate(360deg); opacity:0; }
    }
  </style>
</head>
<body>

<div class="header">The Blessed Hats</div>

<div class="imagen">
  <img src="" class="img-gorra" id="imgGorra">
</div>

<div class="titulo-gorra" id="tituloGorra"></div>

<div class="box">
  <div class="ok" id="autenticado"></div>
  <div class="nombre">Gorra: <span id="nombre"></span></div>
  <div class="scans">Escaneos: <span id="scans">0</span></div>
</div>

<div class="lluvia"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD9pRqLGAhEFIjueCK6PxWXFxWb_tnUBcg",
  authDomain: "autenticidad-8dad7.firebaseapp.com",
  projectId: "autenticidad-8dad7",
  storageBucket: "autenticidad-8dad7.firebasestorage.app",
  messagingSenderId: "613750291310",
  appId: "1:613750291310:web:d6eeacf20efd1e2ee05f7f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const gorras = {
  "TBH01DM": { nombre:"Devil Magic", color:"#FF0000", anim:["diamante","billete","carta"] },
  "TBH02DM": { nombre:"Devil Magic", color:"#FF0000", anim:["diamante","billete","carta"] },
  "TBH03DM": { nombre:"Devil Magic", color:"#FF0000", anim:["diamante","billete","carta"] },
  "TBH04DM": { nombre:"Devil Magic", color:"#FF0000", anim:["diamante","billete","carta"] },

  "TBH01BB": { nombre:"Blessed bandit", img:"blessed.png", color:"#FF69B4", anim:["flor","ninja"] },
  "TBH02BB": { nombre:"Blessed bandit", img:"blessed.png", color:"#FF69B4", anim:["flor","ninja"] },
  "TBH03BB": { nombre:"Blessed bandit", img:"blessed.png", color:"#FF69B4", anim:["flor","ninja"] },
  "TBH04BB": { nombre:"Blessed bandit", img:"blessed.png", color:"#FF69B4", anim:["flor","ninja"] }
};

if(!id || !gorras[id]) {
  document.querySelector(".box").innerHTML = "<h2>ID inválido ❌</h2>";
} else {
  const dataGorra = gorras[id];
  const imgDiv = document.querySelector(".imagen");
  const img = document.getElementById("imgGorra");

  if(id.startsWith("DM")) {
    imgDiv.classList.add("devil");
    document.body.classList.add("devil-bg");
    img.style.display = "none";
  } else {
    img.style.display = "block";
    img.src = dataGorra.img;
  }

  document.getElementById("tituloGorra").innerText = dataGorra.nombre;
  document.getElementById("tituloGorra").style.color = dataGorra.color;
  document.getElementById("autenticado").innerText = "✔ Autenticado por The Blessed Hats";
  document.getElementById("nombre").innerText = dataGorra.nombre;

  const ref = doc(db, "gorras", id);
  getDoc(ref).then(snap=>{
    if(snap.exists()) {
      updateDoc(ref,{scans: increment(1)});
      document.getElementById("scans").innerText = (snap.data().scans||0)+1;
    }
  });

  const lluvia = document.querySelector(".lluvia");

  let intervalo = setInterval(()=>{
    dataGorra.anim.forEach(s=>{
      if(s=="flor") crearElemento("flor","🌸");
      else if(s=="ninja") crearElemento("ninja","🥷🏻");
      else if(s=="diamante") crearElemento("diamante","💎");
      else if(s=="billete") crearElemento("billete","💵");
      else if(s=="carta") {
        const carta = document.createElement("div");
        carta.classList.add("carta");
        carta.style.setProperty('--rand', Math.random());
        lluvia.appendChild(carta);
        setTimeout(()=>carta.remove(),4000);
      }
    });
  },150);

  setTimeout(()=>clearInterval(intervalo),3000);

  function crearElemento(clase, simbolo){
    const el = document.createElement("div");
    el.classList.add(clase);
    el.innerText = simbolo;
    el.style.left = Math.random()*100+"vw";
    el.style.fontSize = (20+Math.random()*30)+"px";
    lluvia.appendChild(el);
    setTimeout(()=>el.remove(),3000);
  }
}
</script>

</body>
</html>
